- id: becker-metr-2025-ai-developer-productivity
  category: M1
  subtopic: "AI coding productivity evidence"
  title: "Measuring the Impact of Early-2025 AI on Experienced Open-Source Developer Productivity"
  authors: "Becker, J.; Rush, N.; Barnes, E.; Rein, D."
  year: 2025
  type: paper
  venue: "arXiv:2507.09089 (METR)"
  url: "https://arxiv.org/abs/2507.09089"
  access: open
  level: intro
  priority: recommended
  modules: [M1, AI]
  summary: "RCT with 16 experienced developers on 246 real tasks. Allowing AI tools (mostly Cursor with Claude 3.5/3.7 Sonnet) raised completion time by 19%, even though the developers believed AI had made them about 20% faster."
