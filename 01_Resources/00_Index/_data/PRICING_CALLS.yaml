  notes: Copyrighted; quote briefly with attribution. robots.txt sets ai-train=no.
- id: roic-ai-earnings-call-transcripts
  category: DATASETS
  section: Earnings-call transcripts
  subtopic: Earnings-call transcripts
  title: 'roic.ai: earnings call transcript pages by ticker and fiscal quarter'
  authors: ROIC AI
  year: 2026
  type: website
  url: https://www.roic.ai/
  access: open
  level: intro
  priority: optional
  modules:
  - M5
  summary: Server-rendered transcript pages at /quote/<TICKER>/transcripts/<FY>-year/<Q>-quarter with one heading per speaker turn and a per-ticker list of quarters;
    coverage was complete for nearly all S&P 1500 retailers in Nov 2021 - Nov 2026. Source for the course's pricing-risk dataset.
  wiki_use: Where to get a recent call when the bulk corpora stop in 2025; see the pricing-risk dataset's Python collector for a polite scraper.
  ai_angle: false
  verified_via: fetch
  notes: Check the site's terms before large reruns; do not republish full transcripts.
