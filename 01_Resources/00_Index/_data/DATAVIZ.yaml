# the rest are link-only because they are paid, unlicensed, too large, or not hosted on GitHub.
- id: yau-flowingdata
  category: M2
  section: 'Data visualization: practitioners, guides and code'
  subtopic: Nathan Yau / FlowingData
  title: FlowingData (Nathan Yau)
  authors: Yau, N.
  year: 2026
  type: website
  url: https://flowingdata.com/
  access: freemium
  level: intro
  priority: core
  modules:
  - M2
  - M8
  summary: 'Nathan Yau''s long-running site on visualization and statistics: free posts that collect and critique notable charts, plus step-by-step tutorials (mostly R, some Python and JavaScript) and the
    ''Process'' newsletter, which are for paying members.'
  wiki_use: Source of strong current examples for an M2 'chart critique' activity. Link to the posts; the members-only tutorials cannot be redistributed.
  ai_angle: false
  verified_via: search
  notes: Tutorials are members-only (https://flowingdata.com/membership/). Nothing was downloaded.
