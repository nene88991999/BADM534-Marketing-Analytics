- id: facebook-social-connectedness-index
  category: M5
  subtopic: "Social networks"
  section: "Network analysis and diffusion"
  title: "Facebook Social Connectedness Index (SCI): friendship links between US counties, zip codes and countries"
  authors: "Bailey, M.; Cao, R.; Kuchler, T.; Stroebel, J.; Wong, A. (Meta Data for Good)"
  year: 2018
  type: dataset
  url: https://ai.meta.com/ai-for-good/datasets/social-connectedness-index/
  access: open
  level: intermediate
  priority: recommended
  modules: [M5, M8, M3]
  summary: "Relative probability that a Facebook user in one area is friends with a user in another, for every pair of US counties and zip codes and of countries and many sub-national regions, built from aggregated Facebook friendships."
  wiki_use: "Word of mouth has a geography: use the SCI to ask whether a product spreads along friendship links (housing beliefs, product adoption, political ads in the authors' papers). Join to county data for an M3 gravity-style regression."
  ai_angle: false
  verified_via: search
  notes: "Introduced in Bailey, Cao, Kuchler, Stroebel and Wong, 'Social Connectedness: Measurement, Determinants, and Effects', Journal of Economic Perspectives 32(3), 2018 (replication data on openICPSR 114016). Download terms are on the Meta / Humanitarian Data Exchange pages."

