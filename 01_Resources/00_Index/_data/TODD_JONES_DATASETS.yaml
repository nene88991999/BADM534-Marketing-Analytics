# Picks from Todd Jones's "Free Datasets for Social Science Research" (github.com/toddrjones/datasets, CC0 list),
# screened for BADM 534 on 2026-10-27. The repo is a README of links (no data files); entries below are the
# marketing-relevant ones not already in the library, plus two AI-adoption sources found while checking them.
- id: toddrjones-free-datasets-list
  category: DATASETS
  subtopic: "Dataset directories"
  section: "Aggregators and package datasets"
  title: "Free Datasets for Social Science Research (curated list)"
  authors: "Jones, T. R."
  year: 2026
  type: website
  url: https://github.com/toddrjones/datasets
  access: open
  license: "CC0 1.0"
  level: intro
  priority: optional
  modules: [M2, M3]
  summary: "A single README listing about 130 free datasets under 33 headings (time use, household surveys, businesses, shopping, names, real estate, social networks, sports, weather and more), each with years, access terms, unit of observation and often a sample paper. Mostly public US data; a few need free data agreements."
  wiki_use: "Point students here when they need data for a term project; most entries are social-science rather than marketing, so pair it with the Datasets folder README, which lists the marketing-specific picks."
  ai_angle: false
  verified_via: fetch
  notes: "Screened 2026-10-27 at commit 4ba0bda. Marketing-relevant entries not already catalogued were added as separate items (Amazon purchase histories, BTOS AI use, Open-Meteo, Chicago business licenses, SSA names, Social Connectedness Index, Our World in Data, County Business Patterns, Zillow, ATUS)."

- id: berke-2024-open-ecommerce-amazon-purchases
  category: DATASETS
  subtopic: "Transactions / RFM / CLV"
  title: "Open e-commerce 1.0: five years of crowdsourced US Amazon purchase histories with user demographics"
  authors: "Berke, A.; Calacci, D.; Mahari, R.; Yabe, T.; Larson, K.; Pentland, S."
  year: 2024
  type: dataset
  venue: "Scientific Data 11, 491 (data on Harvard Dataverse)"
  url: https://doi.org/10.7910/DVN/YGLYDY
  doi: "10.1038/s41597-024-03329-6"
  access: open
  license: "CC0 1.0 (Dataverse); analysis code MIT (github.com/aberke/amazon-study)"
  level: intermediate
  priority: core
  modules: [M2, M4, M7, M8]
  summary: "1,850,717 Amazon.com orders from 5,027 consenting US users, January 2018 to early 2023 (order date, unit price, quantity, ASIN, title, category, shipping state), linked by respondent ID to a survey of demographics, household, Amazon use, lifestyle and health. Files: amazon-purchases.csv (313 MB), survey.csv (1.3 MB), fields.csv, survey instruments."
  wiki_use: "The rare open individual-level purchase panel with demographics: RFM and cohort exercises (M2/M4), next-purchase and recommender exercises (M7), and an M8 privacy discussion (the authors also show which sensitive attributes can be inferred from purchases). Pair with Online Retail II, which has transactions but no demographics."
  tools: [pandas]
  ai_angle: false
  verified_via: fetch
  notes: "License and file sizes read from the Dataverse API on 2026-10-27. The authors ask that the data be used for research and never to re-identify participants. Sample skews female and under-represents older and high-income households (validated against Census in the paper). Not downloaded: 313 MB exceeds the library's local-copy cap; the survey file and an example purchase export (MIT) are small and on GitHub."

- id: berke-2024-cscw-amazon-data-sharing-experiment
  category: M8
  subtopic: "Privacy (academic)"
  section: "Privacy and measurement"
  title: "Insights from an experiment crowdsourcing data from thousands of US Amazon users: the importance of transparency, money, and data use"
  authors: "Berke, A.; Mahari, R.; Pentland, S.; Larson, K.; Calacci, D."
  year: 2024
  type: paper
  venue: "Proceedings of the ACM on Human-Computer Interaction 8 (CSCW2), Article 466"
  url: https://arxiv.org/abs/2404.13172
  doi: "10.1145/3687005"
  access: open
  level: intermediate
  priority: recommended
  modules: [M8, M6]
  summary: "Randomised experiment embedded in the data-collection tool behind Open e-commerce 1.0: showing people their own data raises willingness to share it, sharing rises linearly with the payment offered, real money moves people more than hypothetical money (a field test of the privacy paradox), and willingness differs by demographic group."
  wiki_use: "M8 privacy session: a field experiment on what consumers' data is worth to them, from the same people whose purchases students can analyse. Also an M6 example of an experiment built into a product flow."
  ai_angle: false
  verified_via: search

- id: census-btos-ai-use
  category: M8
  subtopic: Demand for generative AI
  title: "Census Business Trends and Outlook Survey (BTOS): biweekly AI use by US businesses"
  authors: "U.S. Census Bureau"
  year: 2026
  type: dataset
  url: https://www.census.gov/hfp/btos/data
  access: open
  level: intro
  priority: core
  modules: [M8, M2]
  summary: "Nationally representative biweekly survey of US employer businesses since September 2023, with a question on AI use (revised in November 2025 from 'in producing goods or services' to 'in any business function') and expected use in the next six months, by sector, state, the 25 largest metro areas and firm size. National AI use was 19.8% for the period ending 3 May 2026; 37% for firms with 250+ employees; 39.7% in Information, about 14% in Retail."
  wiki_use: "The official counterpart to the Ramp AI Index in genai_demand_lab: compare a probability survey of firms with card-transaction adoption among Ramp customers, and discuss why the levels differ. The November 2025 wording change is a ready-made lesson in series breaks."
  ai_angle: true
  verified_via: fetch
  notes: "Figures from the Census story 'Large Firms With at Least 20 Employees Biggest AI Users' (26 May 2026); supplement documented in CES-WP-26-25. Download files from the BTOS data page."

- id: allen-2026-feds-monitoring-ai-adoption
  category: M8
  subtopic: Demand for generative AI
  title: "Monitoring AI Adoption in the US Economy"
  authors: "Allen, J. S."
  year: 2026
  type: report
  venue: "FEDS Notes, Board of Governors of the Federal Reserve System, 3 April 2026"
  url: https://www.federalreserve.gov/econres/notes/feds-notes/monitoring-ai-adoption-in-the-u-s-economy-20260403.html
  access: open
  level: intro
  priority: recommended
  modules: [M8]
  summary: "Compares three public measures of AI adoption: Census BTOS (about 18% of firms at year-end 2025), the Atlanta Fed's Survey of Business Uncertainty (about 78% employment-weighted firm adoption, 54% for LLMs) and the Real-Time Population Survey (about 41% of workers using generative AI at work, November 2025), and explains why they differ."
  wiki_use: "Five-minute read for the M8 measurement discussion: three numbers that look contradictory until you ask who is counted, how, and whether paid or free use counts. Pairs with Egan et al. (consumers, paid) and the Ramp AI Index (businesses, paid)."
  ai_angle: true
  verified_via: fetch

- id: open-meteo-historical-weather-api
  category: M2
  subtopic: Public APIs
  title: "Open-Meteo historical weather API (keyless, hourly and daily since 1940)"
  authors: "Open-Meteo"
  year: 2026
  type: documentation
  url: https://open-meteo.com/en/docs/historical-weather-api
  access: freemium
  level: intro
  priority: recommended
  modules: [M2, M3, M6]
  summary: "GET https://archive-api.open-meteo.com/v1/archive with latitude, longitude, start_date, end_date and a list of hourly or daily variables (temperature, precipitation, snowfall, wind) returns JSON; no key for non-commercial use, reanalysis-based history back to 1940, plus a forecast API."
  wiki_use: "The second API in the M2 sequence after McBroken: parameters, query strings and JSON arrays. Then join daily weather to sales (McBroken outages, Chicago business data, or any store-level series) for an M3 regression or as a weather instrument in M6."
  tools: [requests, pandas]
  ai_angle: false
  verified_via: fetch
  notes: "Free for non-commercial use; commercial use needs a key. Cite Open-Meteo and the Copernicus/ERA5 source as the docs page requests."

- id: chicago-business-licenses
  category: M2
  subtopic: Public APIs
  title: "City of Chicago Data Portal: Business Licenses (current active), via the Socrata (SODA) API"
  authors: "City of Chicago"
  year: 2026
  type: dataset
  url: https://data.cityofchicago.org/Community-Economic-Development/Business-Licenses-Current-Active/uupf-x98q
  access: open
  level: intro
  priority: optional
  modules: [M2, M3]
  summary: "Every active business license in Chicago with business name, license type and activity, address, ward, community area, latitude and longitude, and start and expiration dates; the portal serves it as CSV or through the SODA JSON API with SQL-like filters ($where, $select, $limit)."
  wiki_use: "A local, geocoded market map for trade-area and competitor-density exercises (how many coffee shops within 1 km of a site?), and a clean example of an API with query parameters. A companion dataset covers all historical licenses."
  tools: [requests, pandas, sodapy]
  ai_angle: false
  verified_via: search
  notes: "API endpoint by Socrata convention: https://data.cityofchicago.org/resource/uupf-x98q.json (not test-called from here; the portal blocked automated page loads on 2026-10-27). Anonymous calls are throttled; a free app token raises the limit."

