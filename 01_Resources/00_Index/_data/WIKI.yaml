# ---------------------------------------------------------------- Hosting
- id: github-pages-limits
  category: WIKI
  subtopic: "GitHub Pages hosting"
  title: "GitHub Pages limits"
  authors: "GitHub"
  year: 2026
  type: documentation
  venue: "GitHub Docs"
  url: "https://docs.github.com/en/pages/getting-started-with-github-pages/github-pages-limits"
  access: open
  level: intro
  priority: core
  modules: [WIKI]
  summary: "Official GitHub Pages limits: a published site can be at most 1 GB, and the source repo should stay under 1 GB. Soft limits are 100 GB/month of bandwidth and 10 builds/hour (custom GitHub Actions builds are exempt), and deployments time out after 10 minutes. Pages is not meant for commercial or sensitive-transaction sites."
  wiki_use: "Instructor-only planning: keep the wiki's datasets and media under these caps, host large data elsewhere (GitHub Releases, Box, Hugging Face), and never collect passwords or student data on the site."
  tools: [GitHub Pages]
  ai_angle: false
  verified_via: fetch
  notes: "Rate-limited requests get HTTP 429. Custom domains use a CNAME record for a subdomain or A/ALIAS/ANAME for an apex domain; verify the domain first to prevent takeover (https://docs.github.com/en/pages/configuring-a-custom-domain-for-your-github-pages-site/about-custom-domains-and-github-pages, fetched). A campus subdomain such as *.illinois.edu would need campus DNS cooperation; that is my inference, not from GitHub's docs."

