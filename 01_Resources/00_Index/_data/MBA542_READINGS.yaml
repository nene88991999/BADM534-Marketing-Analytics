- id: chawla-2002-smote
  category: M7
  section: "Marketing prediction problems"
  subtopic: Imbalanced classification (churn, response)
  title: "SMOTE: Synthetic Minority Over-sampling Technique"
  authors: "Chawla, N. V.; Bowyer, K. W.; Hall, L. O.; Kegelmeyer, W. P."
  year: 2002
  type: paper
  venue: "Journal of Artificial Intelligence Research 16, 321–357"
  url: "https://jair.org/index.php/jair/article/view/10302"
  oa_url: "https://arxiv.org/pdf/1106.1813"
  access: open
  level: intermediate
  priority: optional
  modules: [M7]
  summary: "Introduces oversampling of rare classes by interpolating synthetic minority examples, a standard tool for churn and response models where positives are rare."
  wiki_use: "Background for an imbalanced-churn exercise. Also a good AI-coding check: oversampling before the train/test split leaks information, and AI-written pipelines often make that mistake."
  tools: [imbalanced-learn, scikit-learn]
  ai_angle: true
  verified_via: search
  notes: "Also on the MBA 542 Module 8 reading list. In practice, class weights or threshold tuning often work as well as SMOTE."
