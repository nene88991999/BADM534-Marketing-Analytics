# Readings carried over from the MBA 542 (Digital Marketing, iMBA) module reading lists, added 2026-10-23.
# URLs and DOIs were confirmed through search results; DOIs not seen in a result are omitted.
- id: berger-milkman-2012-viral
  category: M5
  section: "Text analysis in marketing: anchor papers"
  subtopic: Text features and virality
  title: "What Makes Online Content Viral?"
  authors: "Berger, J.; Milkman, K. L."
  year: 2012
  type: paper
  venue: "Journal of Marketing Research 49(2), 192–205"
  url: "https://doi.org/10.1509/jmr.10.0353"
  doi: "10.1509/jmr.10.0353"
  oa_url: "https://faculty.wharton.upenn.edu/wp-content/uploads/2011/11/Virality.pdf"
  access: library
  level: intermediate
  priority: core
  modules: [M5, M3]
  summary: "Codes about 7,000 New York Times articles for emotion with automated sentiment tools and human raters, then models which ones reach the most-emailed list. High-arousal emotions (awe, anger, anxiety) drive sharing more than positivity alone."
  wiki_use: "Classic M5 example of turning text into variables and regressing an outcome on them. Students can replicate the logic with LLM-coded emotions on the MBA 542 Substack dataset."
  tools: [VADER, statsmodels]
  ai_angle: false
  verified_via: search
  notes: "Also on the MBA 542 Module 2 reading list."
