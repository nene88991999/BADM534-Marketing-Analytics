- id: egan-russel-shi-yao-2026-competition-generative-ai
  category: M8
  subtopic: Demand for generative AI
  title: "Competition in Generative AI: Evidence from Consumer Demand"
  authors: "Egan, M. L.; Russel, D.; Shi, C.; Yao, V."
  year: 2026
  type: paper
  venue: "NBER Working Paper 35953"
  url: https://www.nber.org/papers/w35953
  doi: "10.3386/w35953"
  access: paid
  level: advanced
  priority: core
  modules: [M8, M4, M6, M7]
  summary: "Card transactions for 174 million US consumers measure paid adoption of generative-AI services: about 2.9% paying by April 2026, skewed young and high-income; almost all on plans of $30 or less; multihoming common but falling; annual retention 20-45%; switching rising around model releases. A structural demand and supply model finds high price sensitivity, loyalty to AI rather than to providers, and rising substitutability that limits pricing power."
  wiki_use: "Anchor reading for an M8 session on competition in AI, and the source of the measurements reproduced on the synthetic panel in genai_demand_lab. Pairs with the Fradkin OpenRouter paper for the API side."
  ai_angle: true
  verified_via: fetch
  notes: "NBER working papers are paywalled for non-subscribers; UIUC has access. The PDF could not be fetched from the workspace, so the entry rests on the NBER abstract page. Fiserv appears in the author disclosures, not as a stated data source."

