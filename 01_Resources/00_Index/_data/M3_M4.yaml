  access: open
  level: intermediate
  priority: core
  modules: [M4, M8, AI]
  summary: "Mega-study of 19 preregistered studies and 164 outcomes. Digital twins built from 500+ answers per person beat a generic LLM only slightly and correlate weakly with real answers (mean r = 0.20). Five distortions are documented: insufficient individuation, stereotyping, representation bias, ideological bias and hyper-rationality."
  wiki_use: "The most current large-scale validation (2025-26) of synthetic respondents. Use it as the critical counterweight in the synthetic-conjoint activity."
