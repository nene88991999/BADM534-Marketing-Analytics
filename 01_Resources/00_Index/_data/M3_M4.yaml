- id: korkames-stanley-stremersch-2026-ad-elasticity
  category: M3
  subtopic: "Advertising response (empirical generalizations)"
  title: "Meta-Analysis of Advertising Effectiveness: New Insights from Improved Bias Corrections"
  authors: "Korkames, J.; Stanley, T. D.; Stremersch, S."
  year: 2026
  type: paper
  venue: "International Journal of Research in Marketing 43(1), 131-151"
