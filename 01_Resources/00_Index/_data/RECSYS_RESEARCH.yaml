- id: chaney-stewart-engelhardt-2018-algorithmic-confounding
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: Feedback loops
  title: How Algorithmic Confounding in Recommendation Systems Increases Homogeneity and Decreases Utility
  authors: Chaney, A. J. B.; Stewart, B. M.; Engelhardt, B. E.
  year: 2018
  type: paper
  venue: ACM RecSys 2018
  url: https://www.arxiv.org/abs/1710.11214
  access: open
  level: intermediate
  priority: core
  modules:
  - M7
  - M6
  summary: Simulates recommender retraining on behavior shaped by prior recommendations. Under the modeled updating and preference
    processes, feedback can homogenize consumption without improving utility. The results concern a simulation mechanism,
    not a universal field estimate.
  wiki_use: 'Key M6 + M7 idea for analysts: platform data reflect past recommendations, so naive models learn the algorithm''s
    own footprint. A simulation students can reproduce with AI help.'
  local_copy: ../Instructor_Private/01_Resources/07_M7_Recommender_Systems/Readings/ChaneyStewartEngelhardt_ACMRecSys2018.pdf
    (Dropbox only; excluded from Git)
  ai_angle: false
  verified_via: local full-text sections and/or primary publication, 2026-10-23
