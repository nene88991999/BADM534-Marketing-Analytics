- id: luo-yao-zhang-2026-recsys-interventions
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: Field experiments on recommendations
  title: 'Unintended Consequences of Recommender System Interventions: Evidence from a Field Experiment'
  authors: Luo, S.; Yao, S.; Zhang, D. J.
  year: 2026
  type: paper
  venue: Working paper, arXiv 2606.08265v1 (June 2026)
  url: https://arxiv.org/abs/2606.08265v1
  access: open
  level: advanced
  priority: optional
  modules:
  - M7
  - M6
  summary: Studies a temporary ranking boost for celebrity sleep-reminder videos in a randomized platform campaign. The analyzed
    active-user panel shows increased late-night and overall usage, with persistence after the campaign. The authors relate
    persistence to training signals and policy updates generated by the intervention.
  wiki_use: Recent example for the M6/M7 discussion of spillovers and unintended outcomes in platform experiments.
  local_copy: ../Instructor_Private/01_Resources/07_M7_Recommender_Systems/Readings/LuoYaoZhang_WorkingPaper2026.pdf (Dropbox
    only; excluded from Git)
  ai_angle: false
  verified_via: local full-text sections and/or primary publication, 2026-10-23
  notes: Local Sections 4.2–4.3 and Table 6 checked. The analyzed panel contains 200,000 users active on the first experiment
    day. Reported 14.75% and 2.18% figures are relative assignment effects on usage. Mechanism attribution and sample inclusion
    require separate attention.
