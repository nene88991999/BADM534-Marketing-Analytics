- id: zielnicki-2025-value-personalized-recs-netflix
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: Business value of recommendations
  title: 'The Value of Personalized Recommendations: Evidence from Netflix'
  authors: Zielnicki, K.; Aridor, G.; Bibaut, A.; Tran, A.; Chou, W.; Kallus, N.
  year: 2026
  type: paper
  venue: Working paper, June 9, 2026; CESifo working paper (2026)
  url: https://www.ifo.de/en/cesifo/publications/2026/working-paper/value-personalized-recommendations-evidence-netflix
  access: open
  level: advanced
  priority: core
  modules:
  - M7
  - M4
  summary: Uses Netflix viewership and recommendation exposure to estimate a discrete-choice model under conditional exogeneity
    of exposure. A randomized perturbation supplies diversion evidence for model validation. Model-based replacement with
    matrix factorization or popularity-based recommendation lowers engagement by about 4% or 12%, respectively.
  wiki_use: The 'why firms invest in recommenders' anchor for M7. It pairs naturally with the MBA 542 synthetic Netflix viewing
    data.
  local_copy: ../Instructor_Private/01_Resources/07_M7_Recommender_Systems/Readings/ZielnickiAridorBibautTranChouKallus_WorkingPaper2025.pdf
    (Dropbox only; excluded from Git)
  ai_angle: false
  verified_via: local full-text sections and/or primary publication, 2026-10-23
  notes: The supplied PDF is dated June 9, 2026, despite 2025 in its filename. Results are model-based engagement counterfactuals,
    not direct experimental effects of full replacement or measures of consumer welfare. Abstract and identification discussion
    checked locally.
