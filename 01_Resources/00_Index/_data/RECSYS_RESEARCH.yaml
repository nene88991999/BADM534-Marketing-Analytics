- id: ling-nie-nielsen-knauper-yang-dube-2022-goal-oriented-food-rec
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: Instructor research
  title: 'Following Good Examples: Health Goal-Oriented Food Recommendation based on Behavior Data'
  authors: Ling, Y.; Nie, J.-Y.; Nielsen, D.; Knäuper, B.; Yang, N.; Dubé, L.
  year: 2022
  type: paper
  venue: Proceedings of the ACM Web Conference 2022 (WWW '22)
  url: https://dl.acm.org/doi/10.1145/3485447.3514193
  doi: 10.1145/3485447.3514193
  access: library
  license: © 2022 ACM (publisher copyright)
  level: intermediate
  priority: core
  modules:
  - M7
  - M6
  summary: Develops a sequential food recommender combining general, BMI-specific, and goal-specific models learned from food
    logs. Evaluation compares held-out foods in periods associated with the intended weight outcome; it does not estimate
    the causal effect of deploying recommendations on weight.
  wiki_use: 'Instructor''s own paper and the anchor case for the recommender unit: accuracy versus goal attainment, blending
    objectives, and an M6 caution that learning from ''successful'' users builds selection into the training data. A good
    AI-assisted coding exercise is a goal-aware re-ranker on the synthetic viewing or grocery data.'
  local_copy: ../Instructor_Private/01_Resources/07_M7_Recommender_Systems/Yang_research/LNNKYD_WWW_2022.pdf (Dropbox only;
    excluded from Git)
  ai_angle: false
  verified_via: local full-text sections and/or primary publication, 2026-10-23
  notes: 'Also on the MBA 542 Module 5 reading list. Local Sections 3.2 and 5 checked: selected active users, last-basket
    testing, and offline outcome-conditioned evaluation. M7 Section 7.12 distinguishes retrospective outcomes from inputs
    available at recommendation time.'
- id: nielsen-yang-dube-knauper-ling-nie-2022-consumption-variety
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: Instructor research
  title: Consumption Variety in Food Recommendation
  authors: Nielsen, D. E.; Yang, N.; Dubé, L.; Knäuper, B.; Ling, Y.; Nie, J.-Y.
  year: 2022
  type: paper
  venue: Journal of the Association for Consumer Research 7(4)
  url: https://www.journals.uchicago.edu/doi/10.1086/720453
  doi: 10.1086/720453
  access: library
  license: © 2022 Association for Consumer Research; all rights reserved
  level: intermediate
  priority: core
  modules:
  - M7
  - M3
  - M2
  summary: Relates food-consumption variety to recorded calorie and food-composition changes in app logs, then conditions
    the FOODVAR sequential recommender on a variety-change indicator. Offline comparisons assess hit rate and NDCG; the study
    does not randomize users to a variety intervention.
  wiki_use: Instructor's own paper. It moves from a descriptive regression (M3) to a design change in the recommender (M7),
    the full analytics-to-action arc the course teaches. Use it to motivate multi-objective re-ranking and evaluation beyond
    accuracy.
  local_copy: ../Instructor_Private/01_Resources/07_M7_Recommender_Systems/Yang_research/NYDKLN_JACR_2022.pdf (Dropbox only;
    excluded from Git)
  ai_angle: false
  verified_via: local full-text sections and/or primary publication, 2026-10-23
  notes: Also on the MBA 542 Module 5 reading list. Empirical analysis, FOODVAR sections, and Tables 3–5 checked locally.
    Evaluation uses 30 history days, seven validation days, and a final test day. The M8 category-bonus calculation is a separate
    synthetic illustration.
- id: wang-li-chen-2025-recpie-explanations
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: LLM explanations and recommendations
  title: Can Explanations Improve Recommendations? Evidence from Prediction-Informed Explanations
  authors: Wang, Y.; Li, P.; Chen, M.
  year: 2026
  type: paper
  venue: arXiv 2502.16759v3 (May 1, 2026; first posted February 2025)
  url: https://arxiv.org/abs/2502.16759v3
  access: open
  level: advanced
  priority: recommended
  modules:
  - M7
  - AI
