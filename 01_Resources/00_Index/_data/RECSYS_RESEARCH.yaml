- id: milli-2025-engagement-divisive-content
  category: M7
  section: 'Recommender system design: research evidence'
  subtopic: Engagement vs. preferences
  title: Engagement, User Satisfaction, and the Amplification of Divisive Content on Social Media
  authors: Milli, S.; Carroll, M.; Wang, Y.; Pandey, S.; Zhao, S.; Dragan, A. D.
  year: 2025
  type: paper
  venue: PNAS Nexus
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11894805/
  access: open
  level: intermediate
  priority: recommended
  modules:
  - M7
  - M8
  - M6
  summary: A preregistered Twitter audit with 806 users compares engagement-ranked posts with a reverse-chronological baseline
    and collects item-level stated preferences. Engagement ranking amplifies emotionally charged and out-group-hostile content;
    users do not prefer the selected political posts on the stated-preference measure.
  wiki_use: Concrete evidence that the optimization target matters. A good M8 discussion piece on stated versus revealed preferences.
  local_copy: ../Instructor_Private/01_Resources/07_M7_Recommender_Systems/Readings/MilliCarrollPandeyWangDragan_PNASNexus2025.pdf
    (Dropbox only; excluded from Git)
  ai_angle: false
  verified_via: local full-text sections and/or primary publication, 2026-10-23
  doi: 10.1093/pnasnexus/pgaf062
  notes: Corrected author order and restored Sebastian Zhao using the published article. This is an algorithmic audit, not
    assignment to long-term use of alternative feeds. Local PDF is a December 2024 preprint; linked publication is March 2025.
