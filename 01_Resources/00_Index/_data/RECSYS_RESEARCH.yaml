    reports gains in offline point-of-interest ranking and a separate human evaluation of explanations. These evaluations
    do not establish a deployed effect on customer welfare.
  wiki_use: Source paper for the RecPIE teaching artifact built for MBA 542 (accuracy-only vs. explainability-only vs. RecPIE
    modes). It could be reused directly on the M7 wiki page.
  ai_angle: true
  verified_via: local full-text sections and/or primary publication, 2026-10-23
